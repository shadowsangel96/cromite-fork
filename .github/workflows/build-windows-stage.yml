# Una tappa della build Windows (tools/build/gh_windows_stage.py). La usa build-windows.yml.
name: Tappa build Windows

on:
  workflow_call:
    inputs:
      stage:
        type: number
        required: true
      # solo per la tappa 1: riparte dallo stato salvato da quella run invece che da zero
      resume_run:
        type: string
        default: ""
    outputs:
      finished:
        value: ${{ jobs.stage.outputs.finished }}

jobs:
  stage:
    # Chromium 153 chiede Visual Studio 2026 (docs/windows_build_instructions.md)
    runs-on: windows-2025-vs2026
    timeout-minutes: 358
    outputs:
      finished: ${{ steps.build.outputs.finished }}
    env:
      PYTHONUTF8: "1"
      STAGE: ${{ inputs.stage }}
      RESUME_RUN: ${{ inputs.stage == 1 && inputs.resume_run || '' }}
    steps:
      # D: è il disco temporaneo del runner, molto più libero di C:
      - name: Inizio tappa ${{ inputs.stage }}
        shell: pwsh
        run: |
          "JOB_STARTED=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV
          $dir = if (Test-Path D:\) { "D:\b" } else { "C:\b" }
          "FORK_BUILD_DIR=$dir" >> $env:GITHUB_ENV

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Scarica lo stato della tappa precedente
        if: inputs.stage > 1 || env.RESUME_RUN != ''
        uses: actions/download-artifact@v8
        with:
          name: windows-build-state
          path: ${{ env.FORK_BUILD_DIR }}
          run-id: ${{ env.RESUME_RUN || github.run_id }}
          github-token: ${{ github.token }}

      - name: Estrai lo stato
        if: inputs.stage > 1 || env.RESUME_RUN != ''
        shell: pwsh
        run: |
          7z x "$env:FORK_BUILD_DIR\state.zip" "-o$env:FORK_BUILD_DIR\chromium" -y | Select-Object -Last 3
          # 7z esce con 1 per i soli avvisi, con 2 o più per gli errori veri
          if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }
          Remove-Item "$env:FORK_BUILD_DIR\state.zip"
          exit 0

      - name: Prepara (Windows SDK, sorgenti, patch, gn)
        shell: pwsh
        run: python tools\build\gh_windows_stage.py prepare

      - name: Compila
        id: build
        shell: pwsh
        run: python tools\build\gh_windows_stage.py build

      # -mtc=on conserva gli orari dei file: ninja riparte da dove si era fermato.
      # Anche se ninja fallisce: dopo la correzione si riprende da qui (resume_run in build-windows.yml).
      - name: Salva lo stato per la tappa successiva
        id: save
        if: (success() || failure()) && steps.build.outcome != 'skipped' && steps.build.outputs.finished != 'true'
        shell: pwsh
        run: |
          7z a -tzip "$env:FORK_BUILD_DIR\state.zip" "$env:FORK_BUILD_DIR\chromium\src" -mx=1 -mtc=on '-xr!.git' | Select-Object -Last 3
          # codice 1 = solo avvisi: nei sorgenti di Chromium ci sono link simbolici rotti
          # (third_party/nearby, roba per Mac) che 7z non può aprire. L'archivio c'è lo stesso.
          if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }
          "state.zip: {0:N1} GB" -f ((Get-Item "$env:FORK_BUILD_DIR\state.zip").Length / 1GB)
          exit 0

      - name: Carica lo stato
        if: (success() || failure()) && steps.save.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: windows-build-state
          path: ${{ env.FORK_BUILD_DIR }}\state.zip
          compression-level: 0
          retention-days: 2
          overwrite: true

      - name: Carica il pacchetto
        if: steps.build.outputs.finished == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: dist/*.zip
          compression-level: 0
          retention-days: 7
