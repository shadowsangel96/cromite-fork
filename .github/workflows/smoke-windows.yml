# Prova del pacchetto Windows su un runner pulito: si avvia (tools/build/smoke_windows.py) e le
# nostre funzioni fanno quello che promettono (tools/build/prova_funzioni.py).
# La usa build-windows.yml dopo l'ultima tappa; a mano prova il pacchetto di un'altra run.
name: Prova di avvio Windows

on:
  workflow_call:
    inputs:
      run_id:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run da cui prendere il pacchetto release-windows (id)"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          name: release-windows
          path: pkg
          run-id: ${{ inputs.run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Estrai il pacchetto
        shell: pwsh
        run: |
          7z x (Get-ChildItem pkg\*.zip).FullName -opkg -y | Select-Object -Last 3
          if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }
          exit 0

      - name: Avvia il browser
        shell: pwsh
        run: python tools\build\smoke_windows.py pkg smoke

      # dopo la prova di avvio: lì si danno alla cartella i permessi che servono al servizio di rete
      - name: Prova le funzioni
        shell: pwsh
        run: |
          $exe = (Get-ChildItem pkg -Recurse -Filter chrome.exe | Select-Object -First 1).FullName
          python tools\build\prova_funzioni.py $exe smoke

      - name: Carica screenshot e log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-windows
          path: smoke
          retention-days: 7
