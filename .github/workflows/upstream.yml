# Ogni giorno controlla se Cromite ha una nuova release stabile e riapplica le nostre patch.
# Nel repo issue e pull request sono disattivate, quindi:
# - tutto pulito (o conflitti già risolti in passato, via rerere): commit sul ramo + build
# - conflitto o patch diventata vuota: il workflow fallisce (GitHub avvisa via email) e il
#   report è nel riepilogo dell'esecuzione e tra gli artifact
name: Aggiornamento da Cromite

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag Cromite (vuoto = ultima release stabile)"
        required: false
        default: ""
      build:
        description: "Avvia la build dopo un aggiornamento riuscito"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache dei download (Cromite, file di Chromium)
        uses: actions/cache@v6
        with:
          path: .cache
          key: forkctl-${{ github.run_id }}
          restore-keys: forkctl-

      - name: C'è un Cromite nuovo?
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: python3 tools/forkctl.py check --github-output ${TAG:+--to "$TAG"}

      - name: Riapplica le nostre patch
        id: update
        if: steps.check.outputs.update == 'true'
        run: |
          set +e
          python3 tools/forkctl.py update --to "${{ steps.check.outputs.tag }}"
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # 2 = conflitto, 3 = patch diventata vuota: li gestisce l'ultimo step
          if [ $rc -ne 0 ] && [ $rc -ne 2 ] && [ $rc -ne 3 ]; then exit $rc; fi

      - name: Report
        if: steps.check.outputs.update == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: report-${{ steps.check.outputs.version }}
          path: reports/update-${{ steps.check.outputs.version }}.md

      - name: Riepilogo
        if: steps.check.outputs.update == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: cat "reports/update-$VERSION.md" >> "$GITHUB_STEP_SUMMARY"

      # outcome prima di rc: l'output di uno step saltato è null, e null == '0' è vero
      - name: Commit dell'aggiornamento (e build)
        if: steps.update.outcome == 'success' && steps.update.outputs.rc == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
          VERSION: ${{ steps.check.outputs.version }}
          BRANCH: ${{ github.ref_name }}
          AUTO_UPDATE: ${{ vars.AUTO_UPDATE || 'true' }}
          # dalle esecuzioni pianificate (senza input) la build parte sempre
          BUILD: ${{ github.event_name != 'workflow_dispatch' || inputs.build }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A upstream.lock patches state reports
          git commit -m "Aggiorna a Cromite $VERSION" -m "Tag: $TAG"
          python3 tools/forkctl.py privacy-check
          if [ "$AUTO_UPDATE" = "true" ]; then
            git push origin "HEAD:refs/heads/$BRANCH"
            if [ "$BUILD" = "true" ]; then gh workflow run build.yml --ref "$BRANCH"; fi
          else
            git push -f origin "HEAD:refs/heads/upstream/$VERSION"
            echo "::notice::Aggiornamento pronto sul ramo upstream/$VERSION, da unire a mano (AUTO_UPDATE=false)"
          fi

      - name: Serve una decisione sulle patch
        if: steps.update.outcome == 'success' && (steps.update.outputs.rc == '2' || steps.update.outputs.rc == '3')
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          echo "::error::Aggiornamento a $VERSION fermo: serve una decisione sulle patch (report nel riepilogo)"
          exit 1
