<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Blocco contenuti</title>
<style>
:root {
  --text: #1d1d1f; --sub: #5a5a60; --field: rgba(0,0,0,0.07); --sep: rgba(0,0,0,0.12);
  --panel: #fafafc; --group: rgba(0,0,0,0.04); --accent: #0066d6; --accent-bg: rgba(0,102,214,0.12);
  --on-accent: #ffffff; --red: #c4001a; --red-bg: rgba(196,0,26,0.11);
}
@media (prefers-color-scheme: dark) {
  :root {
    --text: #f5f5f7; --sub: #b3b3ba; --field: rgba(255,255,255,0.1); --sep: rgba(255,255,255,0.12);
    --panel: #28282c; --group: rgba(255,255,255,0.05); --accent: #5aa9ff; --accent-bg: rgba(90,169,255,0.16);
    --on-accent: #06203d; --red: #ff6b6b; --red-bg: rgba(255,107,107,0.15);
  }
}
html, body { margin: 0; width: 340px; background: var(--panel); }
body { font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color: var(--text); text-align: left; }
button { font: inherit; cursor: pointer; }
#panel { box-sizing: border-box; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
header { display: flex; align-items: flex-start; gap: 10px; }
header > div { flex: 1; min-width: 0; }
#logo { width: 32px; height: 32px; flex-shrink: 0; }
body.off #logo { filter: grayscale(1) opacity(0.55); }
#title { font-size: 15px; font-weight: 600; }
#subtitle { margin-top: 2px; font-size: 12px; color: var(--sub); }
#close { width: 24px; height: 24px; border: 0; border-radius: 12px; background: var(--field); color: var(--sub); display: flex; align-items: center; justify-content: center; padding: 0; }
#power { display: flex; align-items: center; gap: 12px; padding: 10px; border: 0; border-radius: 14px; background: var(--group); color: var(--text); text-align: left; }
#power-icon { width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; }
body.off #power-icon { background: var(--field); color: var(--sub); }
#power-text { flex: 1; min-width: 0; }
#power-title { display: block; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#power-hint { display: block; margin-top: 2px; font-size: 12px; color: var(--sub); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stat { padding: 10px; border-radius: 12px; background: var(--group); }
.num { font-size: 24px; font-weight: 700; }
#blocked { color: var(--red); }
body.off #blocked { color: var(--sub); }
.of { font-size: 14px; font-weight: 500; color: var(--sub); }
.lbl { margin-top: 2px; font-size: 12px; color: var(--sub); }
h2 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--sub); }
#domains { border-radius: 12px; background: var(--group); max-height: 150px; overflow: auto; }
.row { min-height: 30px; padding: 0 10px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; }
.row + .row { border-top: 1px solid var(--sep); }
.row > span:first-child { flex: 1; min-width: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.count { padding: 2px 8px; border-radius: 9px; background: var(--red-bg); color: var(--red); font-size: 11px; font-weight: 700; }
#domains p { margin: 0; padding: 12px 10px; font-size: 12px; color: var(--sub); }
.tools { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.tools button { min-height: 56px; padding: 6px 2px; border: 0; border-radius: 12px; background: var(--field); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.tools button[aria-pressed="true"] { background: var(--accent-bg); color: var(--accent); }
.tools span { font-size: 11px; font-weight: 600; text-align: center; line-height: 1.2; letter-spacing: -0.2px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions button { min-height: 30px; padding: 0 10px; border: 0; border-radius: 10px; background: var(--field); color: var(--text); font-size: 12px; font-weight: 600; }
.actions #picker { flex: 1; background: var(--accent-bg); color: var(--accent); }
</style>
</head>
<body>
<section id="panel" role="dialog" aria-label="Blocco contenuti">
  <header>
    <img id="logo" src="img/ublock.svg" alt="">
    <div>
      <div id="title">Blocco contenuti</div>
      <div id="subtitle">uBlock Origin, integrato nel browser</div>
    </div>
    <button id="close" aria-label="Chiudi"><svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"></path></svg></button>
  </header>
  <button id="power">
    <span id="power-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 2.5v5"></path><path d="M4.6 4.4a5 5 0 1 0 6.8 0"></path></svg></span>
    <span id="power-text"><span id="power-title"></span><span id="power-hint"></span></span>
  </button>
  <div class="stats">
    <div class="stat">
      <div class="num" id="blocked"></div>
      <div class="lbl">bloccati in questa pagina</div>
    </div>
    <div class="stat">
      <div class="num"><span id="domains-blocked"></span><span class="of"> su <span id="domains-total"></span></span></div>
      <div class="lbl">domini esterni bloccati</div>
    </div>
  </div>
  <div>
    <h2>Bloccati su questo sito</h2>
    <div id="domains"></div>
  </div>
  <div>
    <h2>Su questo sito blocca anche</h2>
    <div class="tools">
      <button data-switch="no-popups" data-state="noPopups"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 5.5h8v7h-8z M5.5 5.5V3h8v7h-3"></path></svg><span>Popup</span></button>
      <button data-switch="no-large-media" data-state="noLargeMedia"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5h11v9h-11z M3.5 12l3.5-3 2.5 2 2-1.5 2 2.5"></path></svg><span>Media grandi</span></button>
      <button data-switch="no-remote-fonts" data-state="noRemoteFonts"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13 8 3l4 10 M5.6 9.5h4.8"></path></svg><span>Font esterni</span></button>
      <button data-switch="no-scripting" data-state="noScripting"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3C4.5 3 4 3.7 4 5v1c0 .8-.5 1.5-1.5 2 1 .5 1.5 1.2 1.5 2v1c0 1.3.5 2 2 2 M10 3c1.5 0 2 .7 2 2v1c0 .8.5 1.5 1.5 2-1 .5-1.5 1.2-1.5 2v1c0 1.3-.5 2-2 2"></path></svg><span>JavaScript</span></button>
    </div>
  </div>
  <div class="actions">
    <button id="picker">Nascondi un elemento</button>
    <button id="logger">Registro</button>
    <button id="settings">Impostazioni</button>
  </div>
</section>
<script src="js/vapi.js"></script>
<script src="js/vapi-common.js"></script>
<script src="js/vapi-client.js"></script>
<script src="blocco.js"></script>
</body>
</html>
